name: mesh-nat-lab

x-node-security: &node-security
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  sysctls:
    - net.ipv4.conf.all.src_valid_mark=1

x-router-security: &router-security
  cap_add:
    - NET_ADMIN
  sysctls:
    - net.ipv4.ip_forward=1
    - net.ipv4.conf.all.rp_filter=0
    - net.ipv4.conf.default.rp_filter=0

services:
  vps:
    build:
      context: ..
      dockerfile: Dockerfile
      target: mesh-server
    image: mesh-vpn/mesh-server:lab
    container_name: mesh-lab-vps
    hostname: vps
    user: mesh
    group_add:
      - mesh-admin
    cap_add:
      - NET_BIND_SERVICE
    environment:
      MESH_CONTROL_BIND_IP: "0.0.0.0"
      MESH_CONTROL_TCP_PORT: "${MESH_CONTROL_TCP_PORT:-443}"
      MESH_STUN_UDP_PORT: "${MESH_STUN_UDP_PORT:-3478}"
      MESH_OBS_BIND_ADDR: "127.0.0.1:9091"
      MESH_OVERLAY_CIDR: "${MESH_OVERLAY_CIDR:-100.115.0.0/16}"
      MESH_DOMAIN_SUFFIX: "mesh.internal"
      MESH_PUBLIC_HOST: "${MESH_PUBLIC_HOST:-172.28.0.10}"
      MESH_TLS_MODE: "${MESH_TLS_MODE:-ip_pinned}"
      MESH_TRUSTED_PROXY_IP: "172.28.0.12"
    volumes:
      - vps_state:/var/lib/mesh
    networks:
      wan_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9091/readyz"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 3s

  vps-proxy:
    profiles:
      - reverse-proxy
    build:
      context: ..
      dockerfile: Dockerfile
      target: vps-proxy
    image: mesh-vpn/vps-proxy:lab
    container_name: mesh-lab-vps-proxy
    hostname: vps-proxy
    environment:
      PROXY_UPSTREAM_HOST: "172.28.0.10"
      PROXY_UPSTREAM_PORT: "${MESH_CONTROL_TCP_PORT:-443}"
      PROXY_LISTEN_PORT: "${MESH_PROXY_TCP_PORT:-443}"
      PROXY_PUBLIC_HOST: "${MESH_PUBLIC_HOST:-vpn.mesh.internal}"
      PROXY_PUBLIC_IP: "172.28.0.12"
    volumes:
      - proxy_ca:/etc/nginx/mesh-certs
    depends_on:
      vps:
        condition: service_healthy
    networks:
      wan_net:
        ipv4_address: 172.28.0.12

  router-1:
    <<: *router-security
    build:
      context: ..
      dockerfile: Dockerfile
      target: lab-router
    image: mesh-vpn/lab-router:lab
    container_name: mesh-lab-router-1
    hostname: router-1
    environment:
      LAB_WAN_SUBNET_PREFIX: "172.28.0."
      LAB_LAN_SUBNET_PREFIX: "172.28.10."
      LAB_SECONDARY_WAN_IP: "172.28.0.121"
      LAB_ROUTER_MODE: "${ROUTER_1_MODE:-eim}"
      LAB_VPS_IP: "${LAB_VPS_IP:-172.28.0.10}"
    networks:
      wan_net:
        ipv4_address: 172.28.0.21
      lan_1:
        ipv4_address: 172.28.10.254

  router-2:
    <<: *router-security
    image: mesh-vpn/lab-router:lab
    container_name: mesh-lab-router-2
    hostname: router-2
    depends_on:
      - router-1
    environment:
      LAB_WAN_SUBNET_PREFIX: "172.28.0."
      LAB_LAN_SUBNET_PREFIX: "172.28.20."
      LAB_SECONDARY_WAN_IP: "172.28.0.122"
      LAB_ROUTER_MODE: "${ROUTER_2_MODE:-eim}"
      LAB_VPS_IP: "${LAB_VPS_IP:-172.28.0.10}"
    networks:
      wan_net:
        ipv4_address: 172.28.0.22
      lan_2:
        ipv4_address: 172.28.20.254

  router-3:
    <<: *router-security
    image: mesh-vpn/lab-router:lab
    container_name: mesh-lab-router-3
    hostname: router-3
    depends_on:
      - router-1
    environment:
      LAB_WAN_SUBNET_PREFIX: "172.28.0."
      LAB_LAN_SUBNET_PREFIX: "172.28.30."
      LAB_SECONDARY_WAN_IP: "172.28.0.123"
      LAB_ROUTER_MODE: "${ROUTER_3_MODE:-apdm}"
      LAB_VPS_IP: "${LAB_VPS_IP:-172.28.0.10}"
    networks:
      wan_net:
        ipv4_address: 172.28.0.23
      lan_3:
        ipv4_address: 172.28.30.254

  router-4:
    <<: *router-security
    image: mesh-vpn/lab-router:lab
    container_name: mesh-lab-router-4
    hostname: router-4
    depends_on:
      - router-1
    environment:
      LAB_WAN_SUBNET_PREFIX: "172.28.0."
      LAB_LAN_SUBNET_PREFIX: "172.28.40."
      LAB_SECONDARY_WAN_IP: "172.28.0.124"
      LAB_ROUTER_MODE: "${ROUTER_4_MODE:-eim}"
      LAB_VPS_IP: "${LAB_VPS_IP:-172.28.0.10}"
    networks:
      wan_net:
        ipv4_address: 172.28.0.24
      lan_4:
        ipv4_address: 172.28.40.254

  router-5:
    <<: *router-security
    image: mesh-vpn/lab-router:lab
    container_name: mesh-lab-router-5
    hostname: router-5
    depends_on:
      - router-1
    environment:
      LAB_WAN_SUBNET_PREFIX: "172.28.0."
      LAB_LAN_SUBNET_PREFIX: "172.28.50."
      LAB_SECONDARY_WAN_IP: "172.28.0.125"
      LAB_ROUTER_MODE: "${ROUTER_5_MODE:-eim}"
      LAB_VPS_IP: "${LAB_VPS_IP:-172.28.0.10}"
    networks:
      wan_net:
        ipv4_address: 172.28.0.25
      lan_5:
        ipv4_address: 172.28.50.254

  node-1:
    <<: *node-security
    build:
      context: ..
      dockerfile: Dockerfile
      target: mesh-node
    image: mesh-vpn/mesh-node:lab
    container_name: mesh-lab-node-1
    hostname: node-1
    depends_on:
      vps:
        condition: service_healthy
      router-1:
        condition: service_started
    environment:
      LAB_NODE_NAME: "node-1"
      LAB_ROUTER_IP: "172.28.10.254"
      LAB_ENABLE_FAKETIME: "${LAB_ENABLE_FAKETIME:-1}"
      LAB_AUTO_RESTART: "${LAB_AUTO_RESTART:-1}"
    volumes:
      - node_1_state:/var/lib/meshd
      - proxy_ca:/etc/mesh/lab-ca:ro
    networks:
      lan_1:
        ipv4_address: 172.28.10.10

  node-2:
    <<: *node-security
    image: mesh-vpn/mesh-node:lab
    container_name: mesh-lab-node-2
    hostname: node-2
    depends_on:
      vps:
        condition: service_healthy
      router-2:
        condition: service_started
      node-1:
        condition: service_started
    environment:
      LAB_NODE_NAME: "node-2"
      LAB_ROUTER_IP: "172.28.20.254"
      LAB_ENABLE_FAKETIME: "${LAB_ENABLE_FAKETIME:-1}"
      LAB_AUTO_RESTART: "${LAB_AUTO_RESTART:-1}"
    volumes:
      - node_2_state:/var/lib/meshd
      - proxy_ca:/etc/mesh/lab-ca:ro
    networks:
      lan_2:
        ipv4_address: 172.28.20.10

  node-3:
    <<: *node-security
    image: mesh-vpn/mesh-node:lab
    container_name: mesh-lab-node-3
    hostname: node-3
    depends_on:
      vps:
        condition: service_healthy
      router-3:
        condition: service_started
      node-1:
        condition: service_started
    environment:
      LAB_NODE_NAME: "node-3"
      LAB_ROUTER_IP: "172.28.30.254"
      LAB_ENABLE_FAKETIME: "${LAB_ENABLE_FAKETIME:-1}"
      LAB_AUTO_RESTART: "${LAB_AUTO_RESTART:-1}"
    volumes:
      - node_3_state:/var/lib/meshd
      - proxy_ca:/etc/mesh/lab-ca:ro
    networks:
      lan_3:
        ipv4_address: 172.28.30.10

  node-4:
    <<: *node-security
    image: mesh-vpn/mesh-node:lab
    container_name: mesh-lab-node-4
    hostname: node-4
    depends_on:
      vps:
        condition: service_healthy
      router-4:
        condition: service_started
      node-1:
        condition: service_started
    environment:
      LAB_NODE_NAME: "node-4"
      LAB_ROUTER_IP: "172.28.40.254"
      LAB_ENABLE_FAKETIME: "${LAB_ENABLE_FAKETIME:-1}"
      LAB_AUTO_RESTART: "${LAB_AUTO_RESTART:-1}"
    volumes:
      - node_4_state:/var/lib/meshd
      - proxy_ca:/etc/mesh/lab-ca:ro
    networks:
      lan_4:
        ipv4_address: 172.28.40.10

  node-5:
    <<: *node-security
    image: mesh-vpn/mesh-node:lab
    container_name: mesh-lab-node-5
    hostname: node-5
    depends_on:
      vps:
        condition: service_healthy
      router-5:
        condition: service_started
      node-1:
        condition: service_started
    environment:
      LAB_NODE_NAME: "node-5"
      LAB_ROUTER_IP: "172.28.50.254"
      LAB_ENABLE_FAKETIME: "${LAB_ENABLE_FAKETIME:-1}"
      LAB_AUTO_RESTART: "${LAB_AUTO_RESTART:-1}"
    volumes:
      - node_5_state:/var/lib/meshd
      - proxy_ca:/etc/mesh/lab-ca:ro
    networks:
      lan_5:
        ipv4_address: 172.28.50.10

volumes:
  vps_state:
  proxy_ca:
  node_1_state:
  node_2_state:
  node_3_state:
  node_4_state:
  node_5_state:

networks:
  wan_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  lan_1:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.10.0/24
  lan_2:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.20.0/24
  lan_3:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.30.0/24
  lan_4:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.40.0/24
  lan_5:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.50.0/24
