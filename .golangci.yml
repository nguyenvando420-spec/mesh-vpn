# golangci-lint v2 — cấu hình LINT + FORMAT duy nhất của dự án mesh-vpn.
# Phiên bản công cụ được ghim trong tools/go.mod (chạy qua `go tool -modfile=tools/go.mod golangci-lint ...`).
# Chuẩn đầy đủ: docs/03-system-design/coding-standards.md · Rule cho Subagent: .agents/rules/coding-standards.md
version: "2"

run:
  go: "1.27"
  timeout: 10m
  tests: true
  modules-download-mode: readonly
  # Build tag đặc thù OS KHÔNG đặt ở đây: lint được chạy lần lượt với GOOS=linux|darwin|windows (scripts/check.*).

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gofumpt:
      module-path: meshvpn.internal/mesh
      extra:
        group-params: true     # func(a int, b int) -> func(a, b int)
        clothe-returns: true   # cấm naked return
    gci:
      # Thứ tự: stdlib → bên thứ ba → module nội bộ. Không dùng nhóm blank/dot riêng.
      sections:
        - standard
        - default
        - prefix(meshvpn.internal/mesh)
      custom-order: true

linters:
  default: none
  enable:
    # --- Đúng đắn & lỗi ---
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errorlint        # %w, errors.Is/As, không so sánh == với error
    - errname          # ErrXxx cho sentinel, XxxError cho kiểu lỗi
    - nilerr
    - nilnil
    - forcetypeassert  # cấm x.(T) không kiểm tra ok
    - durationcheck
    - makezero
    - copyloopvar
    - exhaustive       # switch trên enum phải đủ case
    - unparam
    - predeclared
    - asasalint
    - fatcontext
    # --- Concurrency / vòng đời (US-055: graceful shutdown ≤ 5 s) ---
    - noctx            # HTTP request phải có context
    - contextcheck     # truyền context đúng chuỗi gọi
    - containedctx     # không nhét context.Context vào struct
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    # --- Bảo mật ---
    - gosec
    - depguard         # Dependency Policy (xem settings.depguard)
    - forbidigo        # cấm API nguy hiểm / không có timeout / log thô
    - bidichk
    # --- Phong cách & bảo trì ---
    - revive
    - gocritic
    - misspell
    - unconvert
    - nolintlint       # mọi //nolint phải nêu linter cụ thể + lý do
    - gochecknoinits   # cấm func init()
    - intrange
    - lll
    - cyclop
    - sloglint         # slog: attr kiểu key-value nhất quán, key snake_case, có context
    - canonicalheader
    - usetesting
    - thelper
    - tparallel
    - perfsprint
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - fmt.Fprint     # ghi vào fmt.State/io.Writer của caller: lỗi không xử lý được
        - fmt.Fprintf
        - fmt.Fprintln
    govet:
      enable-all: true
      disable:
        - fieldalignment   # tối ưu bộ nhớ làm xấu đọc code; chỉ dùng khi profile chỉ ra
        - shadow           # revive/staticcheck đã bắt phần có hại
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-QF1008"]
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: false
    gosec:
      excludes:
        - G115   # ép kiểu số nguyên: nhiễu trong parser gói tin; giảm thiểu bằng kiểm biên + fuzz test (coding-standards §3.6)
    revive:
      severity: error
      rules:
        - name: exported
          arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]
        - name: package-comments
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: unused-parameter
        - name: unused-receiver
        - name: empty-block
        - name: empty-lines
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: defer
        - name: dot-imports
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: time-naming
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: use-any
        - name: modifies-value-receiver
        - name: unhandled-error
          arguments: ["fmt.Fprintf", "fmt.Fprintln", "fmt.Fprint"]
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam
        - paramTypeCombine
        - whyNoLint
        - commentedOutCode
    lll:
      line-length: 120
      tab-width: 4
    cyclop:
      max-complexity: 20
      package-average: 0
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    sloglint:
      no-mixed-args: true
      kv-only: true
      context: all         # dùng slog.InfoContext(ctx, ...) để mang request_id
      static-msg: true     # message là hằng; dữ liệu động đi vào attr
      key-naming-case: snake
      forbidden-keys:
        - password
        - passwd
        - secret
        - token
        - private_key
        - privkey
        - preauth_key
        - authkey
    perfsprint:
      err-error: true
      errorf: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^(fmt\.Print(f|ln)?|print|println)$'
          msg: "Cấm in thô ra stdout. Log dùng slog (internal/logx); output CLI dùng io.Writer được inject."
        - pattern: '^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln|New|Default|SetOutput)$'
          msg: "Cấm package log chuẩn. Dùng log/slog qua internal/logx."
        - pattern: '^panic$'
          msg: "Cấm panic trong code production; trả error có ngữ cảnh. Ngoại lệ: //nolint:forbidigo // <lý do> cho invariant lập trình viên."
        - pattern: '^os\.Exit$'
          msg: "Chỉ được gọi os.Exit trong cmd/*/main.go (đã exclude); nơi khác trả error để defer/shutdown chạy."
        - pattern: '^time\.Sleep$'
          msg: "Cấm time.Sleep trong code production. Dùng timer/ticker + <-ctx.Done() để hủy được (US-055)."
        - pattern: '^context\.TODO$'
          msg: "Cấm context.TODO(). Truyền context thật từ caller."
        - pattern: '^http\.(Get|Post|Head|PostForm|ListenAndServe|ListenAndServeTLS|Serve|ServeTLS|DefaultClient|DefaultServeMux|DefaultTransport)$'
          msg: "Cấm http client/server mặc định (không timeout). Dùng internal/httpx.NewClient/NewServer có timeout tường minh."
        - pattern: '^exec\.Command$'
          msg: "Dùng exec.CommandContext(ctx, <đường dẫn tuyệt đối>, args...) qua internal/sysexec; cấm shell (sh -c, cmd /c, powershell -Command)."
        - pattern: '^tls\.Config\.InsecureSkipVerify$|^InsecureSkipVerify$'
          msg: "SEC-04: cấm bỏ qua kiểm tra chứng chỉ ở mọi chế độ. Dùng internal/tlspin (pin SPKI) hoặc CA."
        - pattern: '^rand\.(Int|Intn|Int31|Int31n|Int63|Int63n|Uint32|Uint64|Read|Seed|Shuffle|Perm|Float32|Float64)$'
          msg: "math/rand không dùng cho bảo mật. Bí mật/nonce/ID: crypto/rand qua internal/secure. Jitter: chỉ internal/backoff (math/rand/v2)."
    depguard:
      rules:
        banned-libraries:
          list-mode: lax        # cho phép mọi thứ, trừ danh sách cấm dưới đây
          files: ["$all"]
          deny:
            - pkg: github.com/pkg/errors
              desc: "Dùng errors + fmt.Errorf(\"...: %w\", err)."
            - pkg: github.com/sirupsen/logrus
              desc: "Chỉ log/slog."
            - pkg: go.uber.org/zap
              desc: "Chỉ log/slog."
            - pkg: github.com/rs/zerolog
              desc: "Chỉ log/slog."
            - pkg: log$
              desc: "Chỉ log/slog (qua internal/logx). (Hậu tố $ để KHÔNG chặn log/slog)"
            - pkg: github.com/gorilla/websocket
              desc: "WebSocket chỉ dùng github.com/coder/websocket."
            - pkg: nhooyr.io/websocket
              desc: "Đã đổi tên thành github.com/coder/websocket — dùng đường dẫn mới."
            - pkg: golang.org/x/net/websocket
              desc: "Deprecated. Dùng github.com/coder/websocket."
            - pkg: github.com/stretchr/testify
              desc: "Test chỉ dùng stdlib testing + github.com/google/go-cmp/cmp."
            - pkg: github.com/gin-gonic/gin
              desc: "HTTP chỉ dùng net/http (ServeMux)."
            - pkg: github.com/go-chi/chi
              desc: "HTTP chỉ dùng net/http (ServeMux)."
            - pkg: github.com/labstack/echo
              desc: "HTTP chỉ dùng net/http (ServeMux)."
            - pkg: github.com/gorilla/mux
              desc: "HTTP chỉ dùng net/http (ServeMux)."
            - pkg: github.com/mattn/go-sqlite3
              desc: "Yêu cầu CGO. SQLite chỉ dùng modernc.org/sqlite (CGO_ENABLED=0)."
            - pkg: github.com/glebarez/go-sqlite
              desc: "Trùng chức năng; chỉ modernc.org/sqlite."
            - pkg: github.com/jmoiron/sqlx
              desc: "Cấm ORM/query-builder; dùng database/sql + SQL thuần trong internal/store."
            - pkg: gorm.io/gorm
              desc: "Cấm ORM."
            - pkg: github.com/urfave/cli
              desc: "CLI chỉ dùng github.com/spf13/cobra."
            - pkg: github.com/spf13/viper
              desc: "Config chỉ TOML qua github.com/pelletier/go-toml/v2 + kiểu cấu hình tường minh."
            - pkg: gopkg.in/yaml
              desc: "Không dùng YAML cho config runtime (chỉ TOML)."
            - pkg: github.com/google/uuid
              desc: "ID sinh qua internal/ids (crypto/rand)."
            - pkg: github.com/oklog/ulid
              desc: "ID sinh qua internal/ids (crypto/rand)."
            - pkg: github.com/prometheus/client_golang
              desc: "Metrics chỉ dùng github.com/VictoriaMetrics/metrics."
            - pkg: github.com/caddyserver/certmagic
              desc: "ACME chỉ dùng github.com/go-acme/lego/v4 (xem ADR-08)."
            - pkg: golang.org/x/crypto/acme/autocert
              desc: "ACME chỉ dùng github.com/go-acme/lego/v4 (xem ADR-08)."
            - pkg: github.com/vishvananda/netns
              desc: "Không đổi network namespace trong agent; dùng SO_MARK + policy rule (ADR-07)."
            - pkg: tailscale.com
              desc: "Không import tailscale.com (phụ thuộc khổng lồ, ngoài Dependency Policy). Chỉ tham khảo thiết kế."
            - pkg: github.com/netbirdio/netbird
              desc: "CẤM: mã server NetBird là AGPLv3. Không phụ thuộc cả module."
            - pkg: github.com/juanfont/headscale
              desc: "Không import Headscale; ngoài Dependency Policy."
            - pkg: github.com/pion/
              desc: "Không dùng pion/* (kéo cả stack DTLS). STUN tự viết trong internal/stun (tech-stack §6.3)."
            - pkg: github.com/mullvad/gotatun
              desc: "MPL-2.0 + Rust; không thuộc stack (ADR-01)."
            - pkg: crypto/md5
              desc: "MD5 bị cấm (gosec G501). Dùng crypto/sha256."
            - pkg: crypto/sha1
              desc: "SHA-1 bị cấm (gosec G505). Dùng crypto/sha256."
            - pkg: crypto/des
              desc: "Cipher yếu bị cấm."
            - pkg: crypto/rc4
              desc: "Cipher yếu bị cấm."
            - pkg: math/rand$
              desc: "math/rand (v1) bị cấm. Bí mật dùng crypto/rand; jitter dùng math/rand/v2 trong internal/backoff."
        crypto-only-in-secure:
          list-mode: lax
          # Primitive mật mã chỉ được import trong internal/secure/** (SEC-02, GNFR-01). Nơi khác gọi API cấp cao của gói đó.
          files:
            - "!**/internal/secure/**"
            - "!**/*_test.go"
          deny:
            - pkg: crypto/aes
              desc: "SEC-02: primitive mật mã chỉ trong internal/secure."
            - pkg: crypto/cipher
              desc: "SEC-02: primitive mật mã chỉ trong internal/secure."
            - pkg: crypto/hmac
              desc: "SEC-02: chỉ trong internal/secure."
            - pkg: crypto/ecdh
              desc: "SEC-02: chỉ trong internal/secure."
            - pkg: golang.org/x/crypto/nacl
              desc: "SEC-02: NaCl box chỉ trong internal/secure."
            - pkg: golang.org/x/crypto/curve25519
              desc: "SEC-02: chỉ trong internal/secure."
            - pkg: golang.org/x/crypto/chacha20poly1305
              desc: "SEC-02: chỉ trong internal/secure."
            - pkg: golang.org/x/crypto/hkdf
              desc: "SEC-02: chỉ trong internal/secure."
            - pkg: golang.org/x/crypto/blake2s
              desc: "SEC-02: chỉ trong internal/secure."
            - pkg: golang.org/x/crypto/salsa20
              desc: "SEC-02: chỉ trong internal/secure."

  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      # os.Exit được phép duy nhất ở main().
      - path: 'cmd/[^/]+/main\.go$'
        linters: [forbidigo]
        text: 'os\.Exit'
      # Test: nới lỏng các luật chỉ có ý nghĩa với code production.
      - path: '_test\.go$'
        linters: [forbidigo]
        text: 'time\.Sleep|context\.TODO|exec\.Command|http\.(Get|Post|Head|DefaultClient|DefaultServeMux)'
      - path: '_test\.go$'
        linters: [gosec, cyclop, lll, unparam, forcetypeassert, errcheck]
      # Gói điều phối OS gọi lệnh bên ngoài được kiểm soát tập trung.
      - path: 'internal/sysexec/'
        linters: [forbidigo, gosec]
        text: 'exec\.Command|G204'
      # internal/tlspin là NƠI DUY NHẤT được đặt InsecureSkipVerify (kèm VerifyConnection kiểm pin, fail-closed).
      - path: 'internal/tlspin/'
        linters: [forbidigo, gosec]
        text: 'InsecureSkipVerify|G402'
      # Backoff dùng math/rand/v2 cho jitter (không phải bí mật).
      - path: 'internal/backoff/'
        linters: [forbidigo, gosec]
        text: 'rand\.|G404'
      # Gói logx là nơi duy nhất wrapper slog + redaction.
      - path: 'internal/logx/'
        linters: [sloglint]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
