# Rustfmt configuration — Mesh VPN (stable options compatible with rustc 1.94.1 / rustfmt 1.8.0)
edition = "2024"
style_edition = "2024"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
reorder_imports = true
reorder_modules = true
use_small_heuristics = "Default"
use_field_init_shorthand = true
use_try_shorthand = true
merge_derives = true
