name: Mobile iOS CI

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
      - "fix/**"
      - "sprint/**"
    paths:
      - "crates/**"
      - "tools/uniffi-bindgen/**"
      - "mobile/ios/**"
      - "scripts/build-ios-xcframework.sh"
      - ".github/workflows/mobile-ios.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "crates/**"
      - "tools/uniffi-bindgen/**"
      - "mobile/ios/**"
      - "scripts/build-ios-xcframework.sh"
      - ".github/workflows/mobile-ios.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  ios-simulator-ci:
    name: Build XCFramework, SwiftLint & iOS Simulator XCTest ($0)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Static Hygiene, Security & UTF-8 No-BOM LF Check
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          errors = []
          allowed_suffixes = {
              ".swift", ".yml", ".yaml", ".plist", ".entitlements",
              ".xcstrings", ".json", ".sh", ".md"
          }
          scan_files = [
              pathlib.Path("scripts/build-ios-xcframework.sh"),
              pathlib.Path(".github/workflows/mobile-ios.yml"),
          ]
          ios_root = pathlib.Path("mobile/ios")
          for p in sorted(ios_root.rglob("*")):
              if p.is_dir():
                  if p.suffix in {".xcodeproj", ".xcframework"}:
                      errors.append(f"Forbidden checked-in Apple build artifact: {p}")
                  continue
              if p.suffix.lower() in {".p12", ".mobileprovision", ".ipa"}:
                  errors.append(f"Forbidden signing/archive artifact in git: {p}")
              if p.suffix.lower() in allowed_suffixes:
                  scan_files.append(p)

          prod_dirs = {"MeshCoreKit", "MeshApp", "MeshPacketTunnel"}
          for path in scan_files:
              raw = path.read_bytes()
              if raw.startswith(b"\xef\xbb\xbf"):
                  errors.append(f"UTF-8 BOM detected: {path}")
              if b"\r\n" in raw or b"\r" in raw:
                  errors.append(f"CR/CRLF line ending detected (expected LF): {path}")
              text = raw.decode("utf-8")

              if path.suffix.lower() in {".plist", ".entitlements"}:
                  if "NSAllowsArbitraryLoads" in text:
                      errors.append(f"Forbidden NSAllowsArbitraryLoads in {path}")
                  if "CFBundleURLTypes" in text:
                      errors.append(f"Forbidden CFBundleURLTypes deep-link scheme in {path}")

              if path.suffix.lower() == ".swift" and any(d in path.parts for d in prod_dirs):
                  for idx, line in enumerate(text.splitlines(), start=1):
                      stripped = line.strip()
                      if stripped.startswith("//") or stripped.startswith("/*"):
                          continue
                      if re.search(r"\bfatalError\s*\(", line):
                          errors.append(f"Forbidden fatalError in {path}:{idx}")
                      if re.search(r"\b(try|as)!", line):
                          errors.append(f"Forbidden try!/as! in {path}:{idx}")

          if errors:
              for err in errors:
                  print(err, file=sys.stderr)
              sys.exit(1)
          print(f"Static hygiene checks passed across {len(scan_files)} iOS files.")
          PY

      - name: Install Rust 1.94.1 with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Cache Cargo registry and iOS build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install XcodeGen and SwiftLint
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi

      - name: Build MeshMobileFFI.xcframework and UniFFI Swift bindings
        run: bash scripts/build-ios-xcframework.sh

      - name: Generate Xcode project via XcodeGen
        run: xcodegen generate --spec mobile/ios/project.yml

      - name: Run SwiftLint (--strict)
        run: |
          cd mobile/ios
          swiftlint lint --strict --reporter github-actions-logging

      - name: Select available iPhone Simulator and run xcodebuild build test ($0)
        run: |
          set -euo pipefail
          SIM_UDID="$(python3 - <<'PY'
          import json
          import subprocess
          import sys

          raw = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          )
          data = json.loads(raw)
          preferred = []
          fallback = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for dev in devices:
                  if not dev.get("isAvailable"):
                      continue
                  name = dev.get("name", "")
                  if name == "iPhone 16":
                      preferred.append((runtime, dev["udid"]))
                  elif name.startswith("iPhone"):
                      fallback.append((runtime, dev["udid"]))
          chosen = sorted(preferred, reverse=True) or sorted(fallback, reverse=True)
          if not chosen:
              print("ERROR: No available iPhone Simulator found", file=sys.stderr)
              sys.exit(1)
          print(chosen[0][1])
          PY
          )"
          echo "Using iOS Simulator UDID: ${SIM_UDID}"
          if ! xcodebuild \
            -project mobile/ios/MeshApp.xcodeproj \
            -scheme MeshApp \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -derivedDataPath mobile/ios/build/DerivedDataSim \
            CODE_SIGNING_ALLOWED=NO \
            build test 2>&1 | tee /tmp/ios-xcodebuild.log; then
            python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path("/tmp/ios-xcodebuild.log").read_text(encoding="utf-8", errors="replace").splitlines()
          matches = [ln for ln in lines if re.search(r"(?:error:|fatal error:|BUILD FAILED|Test Case .* failed)", ln)]
          snippet = "\n".join((matches[-10:] + ["--- tail ---"] + lines[-25:])[-36:])
          print("::error title=xcodebuild build test::" + snippet.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
            exit 1
          fi

      - name: Build iOS device Release app & package IPA/App artifacts ($0)
        run: |
          set -euo pipefail
          if ! xcodebuild \
            -project mobile/ios/MeshApp.xcodeproj \
            -scheme MeshApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath mobile/ios/build/DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee /tmp/ios-xcodebuild-device.log; then
            python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path("/tmp/ios-xcodebuild-device.log").read_text(encoding="utf-8", errors="replace").splitlines()
          matches = [ln for ln in lines if re.search(r"(?:error:|fatal error:|BUILD FAILED)", ln)]
          snippet = "\n".join((matches[-10:] + ["--- tail ---"] + lines[-25:])[-36:])
          print("::error title=xcodebuild device release::" + snippet.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
            exit 1
          fi

          ARTIFACTS_DIR="${PWD}/mobile/ios/build/artifacts"
          STAGE_DIR="${RUNNER_TEMP}/ios-package"
          rm -rf "${ARTIFACTS_DIR}" "${STAGE_DIR}"
          mkdir -p "${ARTIFACTS_DIR}" "${STAGE_DIR}/Payload" "${STAGE_DIR}/sim"

          DEVICE_APP_SRC="${PWD}/mobile/ios/build/DerivedDataDevice/Build/Products/Release-iphoneos/MeshApp.app"
          SIM_APP_SRC="${PWD}/mobile/ios/build/DerivedDataSim/Build/Products/Debug-iphonesimulator/MeshApp.app"
          if [ ! -d "${DEVICE_APP_SRC}" ]; then
            echo "ERROR: Expected device MeshApp.app missing at ${DEVICE_APP_SRC}" >&2
            exit 1
          fi
          if [ ! -d "${SIM_APP_SRC}" ]; then
            echo "ERROR: Expected simulator MeshApp.app missing at ${SIM_APP_SRC}" >&2
            exit 1
          fi

          DEVICE_APP_STAGE="${STAGE_DIR}/Payload/MeshApp.app"
          cp -R "${DEVICE_APP_SRC}" "${DEVICE_APP_STAGE}"
          for fw in "${DEVICE_APP_STAGE}/Frameworks/"*.framework; do
            if [ -e "${fw}" ]; then
              codesign --force --sign - --timestamp=none "${fw}"
            fi
          done
          for ext in "${DEVICE_APP_STAGE}/PlugIns/"*.appex; do
            if [ -e "${ext}" ]; then
              codesign --force --sign - --timestamp=none "${ext}"
            fi
          done
          codesign --force --sign - --timestamp=none "${DEVICE_APP_STAGE}"

          (cd "${STAGE_DIR}" && zip -qry "${ARTIFACTS_DIR}/MeshVPN-ios-unsigned.ipa" Payload)
          (cd "${STAGE_DIR}/Payload" && zip -qry "${ARTIFACTS_DIR}/MeshVPN-ios-device.app.zip" MeshApp.app)

          cp -R "${SIM_APP_SRC}" "${STAGE_DIR}/sim/MeshApp.app"
          (cd "${STAGE_DIR}/sim" && zip -qry "${ARTIFACTS_DIR}/MeshVPN-ios-simulator.app.zip" MeshApp.app)

          ls -lh "${ARTIFACTS_DIR}"

      - name: Upload iOS App artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesh-ios-app-artifacts
          path: mobile/ios/build/artifacts/*
          retention-days: 14

      - name: Upload iOS Unsigned IPA installer
        uses: actions/upload-artifact@v4
        with:
          name: MeshVPN-ios-unsigned-ipa
          path: mobile/ios/build/artifacts/MeshVPN-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
