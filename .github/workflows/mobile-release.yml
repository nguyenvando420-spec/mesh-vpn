name: Mobile Release Pipeline (Android & iOS v0.2.x)

on:
  push:
    tags:
      - "v0.2.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag label (e.g. v0.2.0-rc1)"
        type: string
        required: false
        default: "v0.2.0-rc1"
      draft:
        description: "Publish GitHub Release as draft"
        type: boolean
        default: true
      publish_github_release:
        description: "Create GitHub Release on manual workflow_dispatch"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  android-release:
    name: Android Release ($0 APK/AAB + Optional Play Internal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android text hygiene & static security invariants
        run: |
          python3 - <<'PY'
          import os
          import sys

          errors = []
          banned_binaries = (".jks", ".keystore", ".p12", ".apk", ".aab", ".so")
          text_exts = (".kt", ".kts", ".xml", ".pro", ".yml", ".yaml", ".toml", ".sh", ".properties")

          def check_file(path):
              with open(path, "rb") as fh:
                  raw = fh.read()
              if raw.startswith(b"\xef\xbb\xbf"):
                  errors.append(f"{path}: UTF-8 BOM forbidden")
              if b"\r" in raw:
                  errors.append(f"{path}: CRLF forbidden")
              return raw.decode("utf-8")

          for dirpath, _, filenames in os.walk("mobile/android"):
              for fn in filenames:
                  p = os.path.join(dirpath, fn).replace("\\", "/")
                  if p.endswith(banned_binaries):
                      errors.append(f"{p}: binary/signing artifact must not be tracked")
                  if p.endswith(text_exts):
                      text = check_file(p)
                      if p.endswith((".kt", ".kts")):
                          for needle in ("!!", "GlobalScope", "EncryptedSharedPreferences", "com.google.mlkit", "com.google.android.gms", "ndk-context"):
                              if needle in text:
                                  errors.append(f"{p}: forbidden Android pattern '{needle}'")

          check_file("scripts/build-android-ffi.sh")
          check_file("scripts/run-mobile-qa.sh")
          check_file(".github/workflows/mobile-release.yml")

          manifest = open("mobile/android/app/src/main/AndroidManifest.xml", encoding="utf-8").read()
          if 'android:allowBackup="false"' not in manifest:
              errors.append('AndroidManifest.xml must set android:allowBackup="false"')
          if 'android:scheme="mesh"' in manifest:
              errors.append("AndroidManifest.xml must not register mesh:// deep link intent-filter")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("Android release hygiene and manifest security checks passed.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35 & NDK r27c
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/27.2.12479018" >> "${GITHUB_ENV}"

      - name: Install Rust 1.94.1 & Android targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-release-ffi-v1

      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk

      - name: Build Android JNI .so (16 KB aligned, <= 6 MiB) & UniFFI Kotlin bindings
        run: bash scripts/build-android-ffi.sh

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          build-scan-publish: false

      - name: Configure optional Android release keystore ($0 fallback when absent)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.MESH_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.MESH_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.MESH_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.MESH_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "${KEYSTORE_B64}" && -n "${KEYSTORE_PASS}" && -n "${KEY_ALIAS}" && -n "${KEY_PASS}" ]]; then
            python3 - <<'PY'
          import base64
          import os
          data = base64.b64decode(os.environ["KEYSTORE_B64"])
          with open("/tmp/mesh-release.jks", "wb") as fh:
              fh.write(data)
          os.chmod("/tmp/mesh-release.jks", 0o600)
          PY
            echo "MESH_ANDROID_KEYSTORE_PATH=/tmp/mesh-release.jks" >> "${GITHUB_ENV}"
            echo "ANDROID_SIGNING_CONFIGURED=true" >> "${GITHUB_ENV}"
            echo "Android release signing keystore configured."
          else
            echo "ANDROID_SIGNING_CONFIGURED=false" >> "${GITHUB_ENV}"
            echo "::notice title=\$0 Mode (Android Unsigned Release)::ANDROID_KEYSTORE_BASE64/PASSWORD/ALIAS secrets not configured. Building $0 sideload debug APK and unsigned release APK/AAB."
          fi

      - name: Run ktlintCheck, detekt, lintRelease, testDebugUnitTest, assembleRelease & bundleRelease
        working-directory: mobile/android
        env:
          RUSTLS_PLATFORM_VERIFIER_REPO: ${{ github.workspace }}/mobile/android/.m2
          MESH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.MESH_ANDROID_KEYSTORE_PASSWORD }}
          MESH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.MESH_ANDROID_KEY_ALIAS }}
          MESH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.MESH_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            ktlintCheck \
            detekt \
            lintRelease \
            testDebugUnitTest \
            assembleDebug \
            assembleRelease \
            bundleRelease \
            -PrustlsPlatformVerifierRepo="${RUSTLS_PLATFORM_VERIFIER_REPO}"

      - name: Sign & verify release APK/AAB with apksigner and jarsigner (when keystore present)
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.MESH_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.MESH_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.MESH_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          for apk in mobile/android/app/build/outputs/apk/release/*.apk; do
            "${APKSIGNER}" sign \
              --ks /tmp/mesh-release.jks \
              --ks-key-alias "${KEY_ALIAS}" \
              --ks-pass "env:KEYSTORE_PASS" \
              --key-pass "env:KEY_PASS" \
              "${apk}"
            "${APKSIGNER}" verify --verbose "${apk}"
          done
          for aab in mobile/android/app/build/outputs/bundle/release/*.aab; do
            if ! jarsigner -verify "${aab}" >/dev/null 2>&1; then
              jarsigner -keystore /tmp/mesh-release.jks \
                -storepass:env KEYSTORE_PASS \
                -keypass:env KEY_PASS \
                "${aab}" "${KEY_ALIAS}"
            fi
            jarsigner -verify "${aab}"
          done

      - name: Wipe temporary signing keystore
        if: always()
        run: rm -f /tmp/mesh-release.jks

      - name: Verify APK native ABIs, <= 6 MiB budget & 16 KB ELF alignment
        run: |
          python3 - <<'PY'
          import glob
          import struct
          import zipfile

          apks = glob.glob("mobile/android/app/build/outputs/apk/**/*.apk", recursive=True)
          if not apks:
              raise SystemExit("error: no APK outputs produced")

          max_so_bytes = 6 * 1024 * 1024
          for apk in apks:
              with zipfile.ZipFile(apk, "r") as zf:
                  names = set(zf.namelist())
                  for abi in ("arm64-v8a", "x86_64"):
                      entry = f"lib/{abi}/libmesh_mobile_ffi.so"
                      if entry not in names:
                          raise SystemExit(f"error: {apk} missing {entry}")
                      raw = zf.read(entry)
                      if len(raw) > max_so_bytes:
                          raise SystemExit(f"error: {apk} {entry} size {len(raw)} > {max_so_bytes}")
                      e_phoff = struct.unpack_from("<Q", raw, 32)[0]
                      e_phentsize = struct.unpack_from("<H", raw, 54)[0]
                      e_phnum = struct.unpack_from("<H", raw, 56)[0]
                      for idx in range(e_phnum):
                          off = e_phoff + idx * e_phentsize
                          p_type = struct.unpack_from("<I", raw, off)[0]
                          p_align = struct.unpack_from("<Q", raw, off + 48)[0]
                          if p_type == 1 and p_align < 16384:
                              raise SystemExit(f"error: {apk} {entry} p_align={p_align} < 16384")
              print(f"Verified APK {apk}: arm64-v8a + x86_64 present, <= 6 MiB, 16 KB aligned.")
          PY

      - name: Stage Android artifacts & generate SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          cp mobile/android/app/build/outputs/apk/debug/*.apk artifacts/android/
          cp mobile/android/app/build/outputs/apk/release/*.apk artifacts/android/
          cp mobile/android/app/build/outputs/bundle/release/*.aab artifacts/android/
          (
            cd artifacts/android
            sha256sum *.apk *.aab > SHA256SUMS
            cat SHA256SUMS
          )

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesh-android-release-bundle
          path: artifacts/android/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload lint, detekt, ktlint & test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-android-release-reports
          path: mobile/android/app/build/reports/**
          retention-days: 14

      - name: Push AAB to Google Play Internal Track (when service account & keystore present)
        if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_SIGNING_CONFIGURED == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.meshvpn.android
          releaseFiles: mobile/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

      - name: Notice when Google Play Internal upload is skipped ($0 Mode)
        if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON == '' || env.ANDROID_SIGNING_CONFIGURED != 'true' }}
        run: |
          echo "::notice title=Google Play Internal Upload Skipped (\$0 Mode)::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON or Android release signing keystore. Signed/debug APKs remain available for $0 sideloading."

  ios-release:
    name: iOS XCFramework, Simulator XCTest ($0) & Conditional TestFlight
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify iOS static hygiene, UTF-8 No-BOM LF & Swift security invariants
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          errors = []
          allowed_suffixes = {
              ".swift", ".yml", ".yaml", ".plist", ".entitlements",
              ".xcstrings", ".json", ".sh", ".md"
          }
          scan_files = [
              pathlib.Path("scripts/build-ios-xcframework.sh"),
              pathlib.Path("scripts/run-mobile-qa.sh"),
              pathlib.Path(".github/workflows/mobile-release.yml"),
          ]
          ios_root = pathlib.Path("mobile/ios")
          for p in sorted(ios_root.rglob("*")):
              if p.is_dir():
                  if p.suffix in {".xcodeproj", ".xcframework"}:
                      errors.append(f"Forbidden checked-in Apple build artifact: {p}")
                  continue
              if p.suffix.lower() in {".p12", ".mobileprovision", ".ipa"}:
                  errors.append(f"Forbidden signing/archive artifact in git: {p}")
              if p.suffix.lower() in allowed_suffixes:
                  scan_files.append(p)

          prod_dirs = {"MeshCoreKit", "MeshApp", "MeshPacketTunnel"}
          for path in scan_files:
              raw = path.read_bytes()
              if raw.startswith(b"\xef\xbb\xbf"):
                  errors.append(f"UTF-8 BOM detected: {path}")
              if b"\r" in raw:
                  errors.append(f"CR/CRLF line ending detected (expected LF): {path}")
              text = raw.decode("utf-8")

              if path.suffix.lower() in {".plist", ".entitlements"}:
                  if "NSAllowsArbitraryLoads" in text:
                      errors.append(f"Forbidden NSAllowsArbitraryLoads in {path}")
                  if "CFBundleURLTypes" in text:
                      errors.append(f"Forbidden CFBundleURLTypes deep-link scheme in {path}")

              if path.suffix.lower() == ".swift" and any(d in path.parts for d in prod_dirs):
                  for idx, line in enumerate(text.splitlines(), start=1):
                      stripped = line.strip()
                      if stripped.startswith("//") or stripped.startswith("/*"):
                          continue
                      code_only = re.sub(r'"(?:\\.|[^"\\])*"', '""', line)
                      if re.search(r"\bfatalError\s*\(", code_only):
                          errors.append(f"Forbidden fatalError in {path}:{idx}")
                      if re.search(r"\b(try|as)!", code_only):
                          errors.append(f"Forbidden try!/as! in {path}:{idx}")
                      if re.search(r"[A-Za-z0-9_)\]]!(?!=)", code_only):
                          errors.append(f"Forbidden force-unwrap '!' in {path}:{idx}")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"iOS release hygiene checks passed across {len(scan_files)} files.")
          PY

      - name: Install Rust 1.94.1 with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Cache Cargo registry and iOS build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-release-ffi-v1

      - name: Install XcodeGen and SwiftLint
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi

      - name: Build MeshMobileFFI.xcframework (3 slices <= 6 MiB) & Swift bindings
        run: bash scripts/build-ios-xcframework.sh

      - name: Generate Xcode project via XcodeGen
        run: xcodegen generate --spec mobile/ios/project.yml

      - name: Run SwiftLint (--strict)
        working-directory: mobile/ios
        run: swiftlint lint --strict

      - name: Run iOS Simulator XCTest suite ($0 Mode)
        run: |
          set -euo pipefail
          SIM_UDID="$(python3 - <<'PY'
          import json
          import subprocess
          import sys

          raw = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          )
          data = json.loads(raw)
          preferred = []
          fallback = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for dev in devices:
                  if not dev.get("isAvailable"):
                      continue
                  name = dev.get("name", "")
                  if name == "iPhone 16":
                      preferred.append((runtime, dev["udid"]))
                  elif name.startswith("iPhone"):
                      fallback.append((runtime, dev["udid"]))
          chosen = sorted(preferred, reverse=True) or sorted(fallback, reverse=True)
          if not chosen:
              print("ERROR: No available iPhone Simulator found", file=sys.stderr)
              sys.exit(1)
          print(chosen[0][1])
          PY
          )"
          echo "Using iOS Simulator UDID: ${SIM_UDID}"
          xcodebuild \
            -project mobile/ios/MeshApp.xcodeproj \
            -scheme MeshApp \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            CODE_SIGNING_ALLOWED=NO \
            build test

      - name: Package MeshMobileFFI.xcframework, Swift bindings & headers
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios
          tar -C mobile/ios/Frameworks -czf artifacts/ios/MeshMobileFFI.xcframework.tar.gz MeshMobileFFI.xcframework
          cp mobile/ios/Generated/mesh_mobile_ffi.swift artifacts/ios/
          cp mobile/ios/Generated/mesh_mobile_ffiFFI.h artifacts/ios/
          cp mobile/ios/Generated/mesh_mobile_ffiFFI.modulemap artifacts/ios/
          (
            cd artifacts/ios
            shasum -a 256 MeshMobileFFI.xcframework.tar.gz mesh_mobile_ffi.swift mesh_mobile_ffiFFI.h mesh_mobile_ffiFFI.modulemap > SHA256SUMS
            cat SHA256SUMS
          )

      - name: Upload MeshMobileFFI.xcframework & Swift bindings artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesh-ios-xcframework-bundle
          path: artifacts/ios/*
          retention-days: 30
          if-no-files-found: error

      - name: Archive signed .ipa & upload to App Store Connect / TestFlight (hardware_signoff_required)
        if: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APP_STORE_CONNECT_API_KEY_JSON != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/asc-key artifacts/ios-ipa
          python3 - <<'PY'
          import json
          import os
          import pathlib

          payload = json.loads(os.environ["APP_STORE_CONNECT_API_KEY_JSON"])
          key_id = payload["key_id"]
          issuer_id = payload["issuer_id"]
          private_key = payload["private_key"]
          key_path = pathlib.Path(f"/tmp/asc-key/AuthKey_{key_id}.p8")
          key_path.write_text(private_key, encoding="utf-8")
          os.chmod(key_path, 0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"ASC_KEY_ID={key_id}\n")
              fh.write(f"ASC_ISSUER_ID={issuer_id}\n")
              fh.write(f"ASC_KEY_PATH={key_path}\n")
          PY
          cat > /tmp/asc-key/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild archive \
            -project mobile/ios/MeshApp.xcodeproj \
            -scheme MeshApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath artifacts/ios-ipa/MeshApp.xcarchive \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"
          xcodebuild -exportArchive \
            -archivePath artifacts/ios-ipa/MeshApp.xcarchive \
            -exportPath artifacts/ios-ipa/export \
            -exportOptionsPlist /tmp/asc-key/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      - name: Wipe temporary App Store Connect credentials
        if: always()
        run: rm -rf /tmp/asc-key

      - name: Notice when TestFlight upload is skipped (hardware_signoff_required - Apple Developer $99/yr)
        if: ${{ secrets.APPLE_TEAM_ID == '' || secrets.APP_STORE_CONNECT_API_KEY_JSON == '' }}
        run: |
          echo "::notice title=hardware_signoff_required - Apple Developer \$99/yr::APPLE_TEAM_ID or APP_STORE_CONNECT_API_KEY_JSON is not configured. Signed .ipa archive and TestFlight upload skipped; $0 MeshMobileFFI.xcframework and iOS Simulator XCTest suite passed."

  publish-release:
    name: Publish Mobile GitHub Release & Unified SHA256SUMS
    needs: [android-release, ios-release]
    if: ${{ startsWith(github.ref, 'refs/tags/v0.2.') || inputs.publish_github_release == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Android and iOS build bundles
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Compute unified SHA256SUMS
        run: |
          set -euo pipefail
          cd release-dist
          rm -f SHA256SUMS
          sha256sum *.apk *.aab *.tar.gz *.swift *.h *.modulemap > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Mesh VPN Mobile ${{ inputs.tag || github.ref_name }}
          draft: ${{ inputs.draft == true }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release-dist/*.apk
            release-dist/*.aab
            release-dist/*.tar.gz
            release-dist/*.swift
            release-dist/*.h
            release-dist/*.modulemap
            release-dist/SHA256SUMS
