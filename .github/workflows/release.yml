name: Release 4-Target Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag label (e.g. v0.3.0-rc1)"
        type: string
        required: true
      draft:
        description: "Publish as draft GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-and-build:
    name: Verify & Package (${{ matrix.pkg_name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            pkg_name: mesh-linux-x86_64-musl
            archive_ext: tar.gz
            bin_ext: ""
            platform: linux
          - os: macos-15
            target: aarch64-apple-darwin
            pkg_name: mesh-darwin-arm64
            archive_ext: tar.gz
            bin_ext: ""
            platform: macos
          - os: macos-15
            target: x86_64-apple-darwin
            pkg_name: mesh-darwin-x86_64
            archive_ext: tar.gz
            bin_ext: ""
            platform: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg_name: mesh-windows-x86_64-msvc
            archive_ext: zip
            bin_ext: ".exe"
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.94.1 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Install musl-tools for Linux static build
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Add Windows GNU target for compatibility check
        if: matrix.platform == 'windows'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Cache cargo-deny 0.20.2 (Unix)
        if: matrix.platform != 'windows'
        id: cache-deny-unix
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-deny 0.20.2 (Unix)
        if: matrix.platform != 'windows' && steps.cache-deny-unix.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Cache cargo-deny 0.20.2 (Windows)
        if: matrix.platform == 'windows'
        id: cache-deny-win
        uses: actions/cache@v4
        with:
          path: ~/sdk/bin/cargo-deny.exe
          key: cargo-deny-0.20.2-windows-${{ runner.arch }}

      - name: Download verified cargo-deny 0.20.2 (Windows)
        if: matrix.platform == 'windows' && steps.cache-deny-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz'
          $expectedSha256 = '975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc'
          $sdkBin = Join-Path $env:USERPROFILE 'sdk\bin'
          $tmpDir = Join-Path $env:RUNNER_TEMP 'cargo-deny'
          New-Item -ItemType Directory -Force -Path $sdkBin | Out-Null
          New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null
          $archive = Join-Path $tmpDir 'cargo-deny.tar.gz'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expectedSha256) {
            throw "cargo-deny SHA-256 mismatch: expected $expectedSha256, got $actual"
          }
          tar -xzf $archive -C $tmpDir
          $exe = Get-ChildItem -Path $tmpDir -Filter 'cargo-deny.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'cargo-deny.exe not found inside archive' }
          Copy-Item -Path $exe.FullName -Destination (Join-Path $sdkBin 'cargo-deny.exe') -Force

      - name: Run full verification check (Unix)
        if: matrix.platform != 'windows'
        run: sh scripts/check.sh

      - name: Run full verification check (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/check.ps1

      - name: Run SLO verification suite (Unix - US-058)
        if: matrix.platform != 'windows' && matrix.target != 'x86_64-apple-darwin'
        run: bash scripts/run-slo-suite.sh --skip-static-checks --output-dir "$RUNNER_TEMP/slo-report"

      - name: Verify SLO gate fails closed on --simulate-fail (Linux)
        if: matrix.platform == 'linux'
        run: |
          set +e
          bash scripts/run-slo-suite.sh --skip-static-checks --simulate-fail --output-dir "$RUNNER_TEMP/slo-fail-check"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: run-slo-suite.sh --simulate-fail unexpectedly exited 0" >&2
            exit 1
          fi
          echo "Verified fail-closed SLO gate exit code: $rc"

      - name: Run SLO verification suite (Windows - US-058)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/run-slo-suite.ps1 -SkipStaticChecks -OutputDir "$env:RUNNER_TEMP\slo-report"

      - name: Verify SLO gate fails closed on -SimulateFail (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $failDir = Join-Path $env:RUNNER_TEMP 'slo-fail-check'
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          & powershell -ExecutionPolicy Bypass -File scripts/run-slo-suite.ps1 -SkipStaticChecks -SimulateFail -OutputDir $failDir
          $rc = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($rc -eq 0) {
            throw "run-slo-suite.ps1 -SimulateFail unexpectedly exited 0"
          }
          $global:LASTEXITCODE = 0
          Write-Output "Verified fail-closed SLO gate exit code: $rc"

      - name: Download & verify Wintun 0.14.1 and export MESH_WINTUN_SHA256 (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.wintun.net/builds/wintun-0.14.1.zip'
          $expectedZipSha256 = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $tmpDir = Join-Path $env:RUNNER_TEMP 'wintun-download'
          $stageDir = Join-Path $env:RUNNER_TEMP 'wintun-stage'
          New-Item -ItemType Directory -Force -Path $tmpDir, $stageDir | Out-Null
          $zipPath = Join-Path $tmpDir 'wintun-0.14.1.zip'
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          $actualZip = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualZip -ne $expectedZipSha256) {
            throw "Wintun archive SHA-256 mismatch: expected $expectedZipSha256, got $actualZip"
          }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $tmpDir -Force
          $dllPath = Join-Path $tmpDir 'wintun\bin\amd64\wintun.dll'
          if (-not (Test-Path -LiteralPath $dllPath)) {
            throw "wintun/bin/amd64/wintun.dll not found inside archive"
          }
          $dllSha256 = (Get-FileHash -LiteralPath $dllPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($dllSha256 -notmatch '^[0-9a-f]{64}$') {
            throw "Invalid computed wintun.dll SHA-256: $dllSha256"
          }
          Copy-Item -LiteralPath $dllPath -Destination (Join-Path $stageDir 'wintun.dll') -Force
          $licenseFile = Get-ChildItem -Path $tmpDir -Filter 'LICENSE*' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $licenseFile) {
            throw "LICENSE file not found inside wintun-0.14.1.zip"
          }
          Copy-Item -LiteralPath $licenseFile.FullName -Destination (Join-Path $stageDir 'WINTUN-LICENSE.txt') -Force
          $readmeFile = Get-ChildItem -Path $tmpDir -Filter 'README*' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($readmeFile) {
            Copy-Item -LiteralPath $readmeFile.FullName -Destination (Join-Path $stageDir 'README-WINTUN.md') -Force
          }
          "MESH_WINTUN_SHA256=$dllSha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MESH_WINTUN_STAGE_DIR=$stageDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Verified Wintun 0.14.1 SHA-256 and exported MESH_WINTUN_SHA256=$dllSha256"

      - name: Build release binaries for ${{ matrix.target }} (Unix)
        if: matrix.platform != 'windows'
        run: cargo build --release --locked --target ${{ matrix.target }} --bin mesh --bin meshd --bin mesh-server

      - name: Build release binaries for ${{ matrix.target }} (Windows)
        if: matrix.platform == 'windows'
        run: cargo build --release --locked --target ${{ matrix.target }} --bin MeshVPN --bin mesh --bin meshd --bin mesh-server

      - name: Verify Windows GNU compilation
        if: matrix.platform == 'windows'
        run: cargo check --locked --target x86_64-pc-windows-gnu --bin MeshVPN --bin mesh --bin meshd --bin mesh-server

      - name: Verify MeshVPN.exe size <= 6 MiB & PE subsystem == 2 (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python - <<'PY'
          import pathlib
          import struct

          exe = pathlib.Path("target/x86_64-pc-windows-msvc/release/MeshVPN.exe")
          raw = exe.read_bytes()
          size_bytes = len(raw)
          max_bytes = 6_291_456
          goal_bytes = 4 * 1024 * 1024
          print(f"MeshVPN.exe size: {size_bytes} bytes ({size_bytes / 1048576:.2f} MiB)")
          if size_bytes > max_bytes:
              raise SystemExit(f"ERROR: MeshVPN.exe exceeds 6 MiB gate ({size_bytes} > {max_bytes})")
          if size_bytes > goal_bytes:
              print(f"::warning file={exe}::MeshVPN.exe ({size_bytes / 1048576:.2f} MiB) exceeds 4.00 MiB design target")

          e_lfanew = struct.unpack_from("<I", raw, 0x3C)[0]
          if raw[e_lfanew:e_lfanew + 4] != b"PE\x00\x00":
              raise SystemExit("ERROR: invalid PE signature in MeshVPN.exe")
          subsystem = struct.unpack_from("<H", raw, e_lfanew + 24 + 68)[0]
          if subsystem != 2:
              raise SystemExit(f"ERROR: MeshVPN.exe PE subsystem={subsystem}, expected 2 (IMAGE_SUBSYSTEM_WINDOWS_GUI)")
          PY

      - name: Conditional Windows Authenticode signing (US-117, graceful $0 fallback)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WIN_PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WIN_PFX_PASS: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          WIN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WIN_PFX_B64) -or [string]::IsNullOrWhiteSpace($env:WIN_PFX_PASS)) {
            Write-Output "::notice title=\$0 Mode (Windows Unsigned Release)::WINDOWS_CODESIGN_PFX_BASE64/PASSWORD secrets absent; releasing unsigned Windows binaries (\$0 Mode)."
            exit 0
          }
          $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter 'signtool.exe' -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe not found in Windows Kits 10 SDK"
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'mesh-authenticode.pfx'
          try {
            $bytes = [Convert]::FromBase64String($env:WIN_PFX_B64)
            [System.IO.File]::WriteAllBytes($pfxPath, $bytes)
            foreach ($binName in @('MeshVPN.exe', 'mesh.exe', 'meshd.exe', 'mesh-server.exe')) {
              $binPath = Join-Path 'target\x86_64-pc-windows-msvc\release' $binName
              & $signtool.FullName sign /f $pfxPath /p $env:WIN_PFX_PASS /fd SHA256 /tr $env:WIN_TIMESTAMP_URL /td SHA256 $binPath
              if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $binPath" }
              & $signtool.FullName verify /pa $binPath
              if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $binPath" }
            }
          }
          finally {
            if (Test-Path -LiteralPath $pfxPath) {
              Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload raw Darwin binaries for universal macOS app packaging
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: darwin-raw-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/mesh
            target/${{ matrix.target }}/release/meshd
            target/${{ matrix.target }}/release/mesh-server
          if-no-files-found: error

      - name: Ad-hoc codesign macOS CLI binaries
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          for b in mesh meshd mesh-server; do
            bin_path="target/${{ matrix.target }}/release/$b"
            codesign --force -s - "$bin_path"
            codesign -v "$bin_path"
          done

      - name: Package release bundle & compute explicit SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          MAX_BYTES=$((16 * 1024 * 1024))
          GUI_MAX_BYTES=$((6 * 1024 * 1024))
          STAGE="stage/${{ matrix.pkg_name }}"
          OUT="artifacts"
          mkdir -p "$STAGE" "$OUT"

          if [ "${{ matrix.platform }}" = "windows" ]; then
            BINS="MeshVPN mesh meshd mesh-server"
          else
            BINS="mesh meshd mesh-server"
          fi

          for b in $BINS; do
            src="target/${{ matrix.target }}/release/${b}${{ matrix.bin_ext }}"
            test -f "$src"
            size_bytes="$(wc -c < "$src" | tr -d '[:space:]')"
            size_mib="$(awk "BEGIN { printf \"%.2f\", $size_bytes / 1048576 }")"
            echo "${b} (${{ matrix.target }}): ${size_bytes} bytes (${size_mib} MiB)"
            if [ "$b" = "MeshVPN" ]; then
              if [ "$size_bytes" -gt "$GUI_MAX_BYTES" ]; then
                echo "ERROR: $src exceeds hard 6 MiB gate" >&2
                exit 1
              fi
            elif [ "$size_bytes" -gt "$MAX_BYTES" ]; then
              echo "ERROR: $src exceeds hard 16 MiB gate" >&2
              exit 1
            fi
            cp "$src" "$STAGE/"
          done

          if [ "${{ matrix.platform }}" = "linux" ]; then
            mkdir -p "$STAGE/scripts" "$STAGE/deploy/systemd" "$STAGE/deploy/linux-desktop"
            cp scripts/install-linux.sh scripts/install-server.sh "$STAGE/scripts/"
            cp deploy/systemd/* "$STAGE/deploy/systemd/"
            cp deploy/linux-desktop/* "$STAGE/deploy/linux-desktop/"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            mkdir -p "$STAGE/scripts" "$STAGE/deploy/launchd"
            cp scripts/install-macos.sh "$STAGE/scripts/"
            cp deploy/launchd/internal.mesh.meshd.plist "$STAGE/deploy/launchd/"
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            mkdir -p "$STAGE/scripts"
            cp scripts/install-windows.ps1 "$STAGE/scripts/"
            wintun_dir="$(cygpath -u "$MESH_WINTUN_STAGE_DIR" 2>/dev/null || printf '%s' "$MESH_WINTUN_STAGE_DIR")"
            test -f "${wintun_dir}/wintun.dll"
            cp "${wintun_dir}/wintun.dll" "$STAGE/wintun.dll"
            printf '%s  wintun.dll\n' "${MESH_WINTUN_SHA256}" > "$STAGE/wintun.dll.sha256"
            if [ -f "${wintun_dir}/WINTUN-LICENSE.txt" ]; then
              cp "${wintun_dir}/WINTUN-LICENSE.txt" "$STAGE/WINTUN-LICENSE.txt"
            fi
            if [ -f "${wintun_dir}/README-WINTUN.md" ]; then
              cp "${wintun_dir}/README-WINTUN.md" "$STAGE/README-WINTUN.md"
            fi
          fi

          (
            cd "$STAGE"
            if [ "${{ matrix.platform }}" = "windows" ]; then
              sha256sum MeshVPN.exe mesh.exe meshd.exe mesh-server.exe wintun.dll > SHA256SUMS
            elif command -v sha256sum >/dev/null 2>&1; then
              sha256sum mesh meshd mesh-server > SHA256SUMS
            else
              shasum -a 256 mesh meshd mesh-server > SHA256SUMS
            fi
          )

          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar -C "$STAGE" -czf "${OUT}/${{ matrix.pkg_name }}.tar.gz" .
          else
            powershell -NoProfile -Command "Compress-Archive -Path '${STAGE}/*' -DestinationPath '${OUT}/${{ matrix.pkg_name }}.zip' -Force"
          fi

      - name: Upload packaged archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.pkg_name }}
          path: artifacts/${{ matrix.pkg_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  package-macos-desktop:
    name: Package Universal macOS Mesh VPN.app & DMG
    needs: [verify-and-build]
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download arm64 & x86_64 Darwin binaries
        uses: actions/download-artifact@v4
        with:
          pattern: darwin-raw-*
          path: darwin-raw

      - name: Install or verify XcodeGen and SwiftLint
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi

      - name: Configure optional Apple Developer ID keychain (US-117, graceful $0 fallback)
        env:
          DEV_ID_P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          DEV_ID_P12_PASS: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          DEV_ID_APP: ${{ secrets.APPLE_DEVELOPER_ID_APP }}
          DEV_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
          NOTARY_P8_B64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${DEV_ID_P12_B64}" ] || [ -z "${DEV_ID_P12_PASS}" ] || [ -z "${DEV_ID_APP}" ]; then
            echo "::notice title=\$0 Mode (macOS Ad-Hoc App Bundle)::APPLE_DEVELOPER_ID_* secrets absent; packaging \$0 ad-hoc signed Mesh VPN.app & .dmg."
            exit 0
          fi
          mkdir -p /tmp/mesh-apple-signing
          python3 - <<'PY'
          import base64, os, pathlib
          p12 = base64.b64decode(os.environ["DEV_ID_P12_B64"])
          p12_path = pathlib.Path("/tmp/mesh-apple-signing/devid.p12")
          p12_path.write_bytes(p12)
          os.chmod(p12_path, 0o600)
          p8_b64 = os.environ.get("NOTARY_P8_B64", "")
          if p8_b64:
              p8 = base64.b64decode(p8_b64)
              p8_path = pathlib.Path("/tmp/mesh-apple-signing/notary.p8")
              p8_path.write_bytes(p8)
              os.chmod(p8_path, 0o600)
          PY
          KEYCHAIN="/tmp/mesh-apple-signing/build.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "${KC_PASS}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KC_PASS}" "${KEYCHAIN}"
          security import /tmp/mesh-apple-signing/devid.p12 -k "${KEYCHAIN}" -P "${DEV_ID_P12_PASS}" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KC_PASS}" "${KEYCHAIN}"
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain-db
          echo "APPLE_DEVELOPER_ID_APP=${DEV_ID_APP}" >> "${GITHUB_ENV}"
          if [ -n "${DEV_ID_INSTALLER}" ]; then
            echo "APPLE_DEVELOPER_ID_INSTALLER=${DEV_ID_INSTALLER}" >> "${GITHUB_ENV}"
          fi
          if [ -f /tmp/mesh-apple-signing/notary.p8 ] && [ -n "${NOTARY_KEY_ID}" ] && [ -n "${NOTARY_ISSUER_ID}" ]; then
            echo "APPLE_NOTARY_KEY_PATH=/tmp/mesh-apple-signing/notary.p8" >> "${GITHUB_ENV}"
            echo "APPLE_NOTARY_KEY_ID=${NOTARY_KEY_ID}" >> "${GITHUB_ENV}"
            echo "APPLE_NOTARY_ISSUER_ID=${NOTARY_ISSUER_ID}" >> "${GITHUB_ENV}"
          fi

      - name: Run 3-step macOS packaging & verification (ADR-026)
        run: |
          set -euo pipefail
          chmod +x darwin-raw/darwin-raw-aarch64-apple-darwin/* darwin-raw/darwin-raw-x86_64-apple-darwin/*
          bash scripts/package-macos-app.sh \
            --arch universal \
            --arm64-bin-dir darwin-raw/darwin-raw-aarch64-apple-darwin \
            --x86_64-bin-dir darwin-raw/darwin-raw-x86_64-apple-darwin \
            --out-dir artifacts/macos \
            --dmg-name MeshVPN-macos-universal.dmg

      - name: Cleanup temporary Apple signing credentials
        if: always()
        run: |
          security delete-keychain /tmp/mesh-apple-signing/build.keychain-db >/dev/null 2>&1 || true
          rm -rf /tmp/mesh-apple-signing

      - name: Upload macOS universal DMG (and optional .pkg)
        uses: actions/upload-artifact@v4
        with:
          name: release-mesh-macos-universal
          path: |
            artifacts/macos/MeshVPN-macos-universal.dmg
            artifacts/macos/*.pkg
          if-no-files-found: error

  build-server-container:
    name: Build & Verify mesh-server Production Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build unprivileged mesh-server Docker image
        run: |
          docker build --target mesh-server -t mesh-server:release .
          uid="$(docker run --rm --entrypoint id mesh-server:release -u)"
          groups="$(docker run --rm --entrypoint id mesh-server:release -Gn)"
          echo "mesh-server container UID=$uid GROUPS=$groups"
          test "$uid" != "0"
          printf ' %s ' "$groups" | grep -q ' mesh-admin '

      - name: Export mesh-server OCI tarball
        run: |
          mkdir -p artifacts
          docker save mesh-server:release | gzip -c > artifacts/mesh-server-image-linux-amd64.tar.gz

      - name: Upload container tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-mesh-server-image
          path: artifacts/mesh-server-image-linux-amd64.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish Unified SHA256SUMS & GitHub Release
    needs: [verify-and-build, package-macos-desktop, build-server-container]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-dist
          merge-multiple: true

      - name: Generate unified SHA256SUMS
        id: dist_files
        run: |
          set -euo pipefail
          cd release-dist
          files=()
          for ext in tar.gz zip dmg pkg; do
            for f in *."${ext}"; do
              if [ -f "$f" ]; then
                files+=("$f")
              fi
            done
          done
          test "${#files[@]}" -gt 0
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          {
            echo "files<<EOF"
            for f in "${files[@]}"; do
              echo "release-dist/${f}"
            done
            echo "release-dist/SHA256SUMS"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Mesh VPN ${{ inputs.tag || github.ref_name }}
          draft: ${{ inputs.draft == true }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Mesh VPN Desktop & CLI Release

            - **Windows**: Extract `mesh-windows-x86_64-msvc.zip` and launch `MeshVPN.exe` (or run `scripts/install-windows.ps1` as Administrator).
            - **macOS (`$0` Ad-Hoc Signed)**: Open `MeshVPN-macos-universal.dmg`, drag `Mesh VPN.app` to `/Applications`, and on first launch **Right-click -> Open** (or allow in *System Settings -> Privacy & Security*) to acknowledge Gatekeeper for unsigned/ad-hoc builds.
            - Verify all downloads against `SHA256SUMS`.
          files: ${{ steps.dist_files.outputs.files }}
