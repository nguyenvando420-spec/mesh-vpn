name: CI Gate

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
      - "fix/**"
      - "sprint/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_live_nat_lab:
        description: "Run live Docker NAT Lab US-028 acceptance suite"
        type: boolean
        default: false
      flap_duration_secs:
        description: "NAT port-flap duration in seconds for live lab run"
        type: string
        default: "90"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  static-and-lab-lint:
    name: Static, BOM/LF & Lab Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify UTF-8 No BOM, LF line endings & Desktop macOS static invariants
        run: |
          python3 - <<'PY'
          import pathlib
          import plistlib
          import re
          import sys

          targets = []
          for p in sorted(pathlib.Path(".").glob("Dockerfile*")):
              if p.is_file():
                  targets.append(p)
          for folder in ("lab", ".github/workflows", "docs", "scripts", "deploy"):
              root = pathlib.Path(folder)
              if root.exists():
                  for p in sorted(root.rglob("*")):
                      if not p.is_file() or ".tmp" in p.parts:
                          continue
                      targets.append(p)

          macos_root = pathlib.Path("desktop/macos")
          forbidden_macos_exts = {".p12", ".mobileprovision", ".cer", ".dmg", ".pkg", ".app"}
          errors = []
          if macos_root.exists():
              for p in sorted(macos_root.rglob("*")):
                  rel = p.as_posix()
                  if (
                      ".build" in p.parts
                      or "DerivedData" in p.parts
                      or any(part.endswith(".xcodeproj") for part in p.parts)
                  ):
                      continue
                  if p.suffix.lower() in forbidden_macos_exts:
                      errors.append(f"Forbidden macOS artifact in git: {rel}")
                      continue
                  if not p.is_file():
                      continue
                  targets.append(p)

          spctl_pattern = re.compile("spctl" + r"\s+--master-disable")
          for path in targets:
              data = path.read_bytes()
              if data.startswith(b"\xef\xbb\xbf"):
                  errors.append(f"UTF-8 BOM detected: {path}")
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError as exc:
                  errors.append(f"Invalid UTF-8 in {path}: {exc}")
                  continue
              if path.suffix.lower() not in {".ps1", ".bat", ".cmd"} and b"\r\n" in data:
                  errors.append(f"CRLF detected (expected LF): {path}")

              rel = path.as_posix()
              if (
                  rel.startswith(("desktop/macos/", "scripts/", ".github/workflows/"))
                  and rel not in {"scripts/check.ps1", "scripts/check.sh", ".github/workflows/ci.yml"}
                  and path.suffix.lower() in {
                      ".rs", ".swift", ".sh", ".ps1", ".yml", ".yaml", ".plist", ".entitlements", ".toml"
                  }
              ):
                  if spctl_pattern.search(text):
                      errors.append(f"Forbidden Gatekeeper disable command in {rel}")

              if rel.startswith("desktop/macos/"):
                  if path.suffix.lower() in {".entitlements", ".plist", ".yml", ".yaml"}:
                      if "com.apple.security.app-sandbox" in text:
                          errors.append(f"Forbidden App Sandbox in {rel}")
                      if path.suffix.lower() != ".entitlements":
                          if "CFBundleURLTypes" in text:
                              errors.append(f"Forbidden CFBundleURLTypes in {rel}")
                          if "NSAllowsArbitraryLoads" in text:
                              errors.append(f"Forbidden NSAllowsArbitraryLoads in {rel}")
                  if path.suffix.lower() == ".swift" and re.search(r"^\s*import\s+UIKit\b", text, re.MULTILINE):
                      errors.append(f"Forbidden iOS UIKit import in {rel}")

              if path.suffix.lower() in {".plist", ".entitlements"}:
                  try:
                      plistlib.loads(data)
                  except Exception as exc:
                      errors.append(f"Invalid plist XML in {rel}: {exc}")

          if errors:
              for err in errors:
                  print(err, file=sys.stderr)
              sys.exit(1)
          print(f"Verified UTF-8 No BOM, LF, and static security invariants across {len(targets)} files.")
          PY

      - name: Check bash syntax on all shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done < <(find lab scripts -type f -name '*.sh' -print0 | sort -z)

      - name: Validate NAT Lab compose & no-privileged invariant
        run: |
          set -euo pipefail
          docker compose -f lab/docker-compose.nat-lab.yml --profile reverse-proxy config --quiet
          if grep -Eiq 'privileged:[[:space:]]*true' lab/docker-compose.nat-lab.yml; then
            echo "ERROR: privileged: true is forbidden in lab/docker-compose.nat-lab.yml" >&2
            exit 1
          fi

  check-linux:
    name: Check Linux (scripts/check.sh)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.94.1 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache cargo-deny 0.20.2
        id: cache-deny
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-linux-${{ runner.arch }}

      - name: Install cargo-deny 0.20.2 if not cached
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-deny --version 0.20.2

      - name: Run scripts/check.sh
        run: |
          set -o pipefail
          if ! sh scripts/check.sh 2>&1 | tee /tmp/check-sh.log; then
            echo "::warning title=scripts/check.sh::First attempt failed; retrying once..."
            if ! sh scripts/check.sh 2>&1 | tee /tmp/check-sh.log; then
              python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path("/tmp/check-sh.log").read_text(encoding="utf-8", errors="replace").splitlines()
          matches = [ln for ln in lines if re.search(r"(?:FAILED|error(?:\[|:)|panicked at|ERROR:)", ln)]
          snippet = "\n".join((matches[-15:] + ["--- tail ---"] + lines[-25:])[-40:])
          print("::error title=scripts/check.sh::" + snippet.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
              exit 1
            fi
          fi

      - name: Run SLO verification suite (US-058)
        run: bash scripts/run-slo-suite.sh --skip-static-checks --output-dir "$RUNNER_TEMP/slo-report"

      - name: Verify SLO CI gate fails closed on --simulate-fail
        run: |
          set +e
          bash scripts/run-slo-suite.sh --skip-static-checks --simulate-fail --output-dir "$RUNNER_TEMP/slo-fail-check"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: run-slo-suite.sh --simulate-fail unexpectedly exited 0" >&2
            exit 1
          fi
          echo "Verified fail-closed SLO gate exit code: $rc"

      - name: Upload Linux SLO verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-report-linux
          path: ${{ runner.temp }}/slo-report/*
          if-no-files-found: ignore

  check-macos:
    name: Check macOS & Desktop macOS (scripts/check.sh, Swift 6 XCTest & Darwin Release)
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Xcode 16 (Swift 6.0) toolchain is active
        run: |
          set -euo pipefail
          if ! swift --version | grep -q "Swift version 6\."; then
            XCODE16="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$XCODE16" ]; then
              sudo xcode-select -s "$XCODE16/Contents/Developer"
            fi
          fi
          swift --version
          xcodebuild -version

      - name: Install or verify XcodeGen and SwiftLint
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          xcodegen --version
          swiftlint version

      - name: Run SwiftPM unit tests (MeshDesktopCore)
        run: |
          set -o pipefail
          swift test --package-path desktop/macos/MeshDesktopCore 2>&1 | tee /tmp/mesh-swift-test.log || {
            python3 - <<'PY'
          import pathlib
          log = pathlib.Path("/tmp/mesh-swift-test.log").read_text(encoding="utf-8", errors="replace")
          for line in log.splitlines():
              if any(k in line for k in ("error:", "failed", "Fatal error", "XCTAssert")):
                  print(f"::error title=swift test::{line[:300]}")
          PY
            exit 1
          }

      - name: Generate Xcode project, run SwiftLint --strict & xcodebuild test
        run: |
          set -euo pipefail
          cd desktop/macos
          xcodegen generate
          swiftlint lint --strict --config .swiftlint.yml --reporter github-actions-logging 2>&1 | tee /tmp/mesh-swiftlint.log || {
            python3 - <<'PY'
          import pathlib
          log = pathlib.Path("/tmp/mesh-swiftlint.log").read_text(encoding="utf-8", errors="replace")
          for line in log.splitlines():
              if any(k in line for k in ("error:", "warning:", "Violation")):
                  print(f"::error title=swiftlint::{line[:300]}")
          PY
            exit 1
          }
          if ! xcodebuild test \
            -project MeshVPNApp.xcodeproj \
            -scheme MeshVPNApp \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/macos-desktop-xcodebuild.log; then
            python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path("/tmp/macos-desktop-xcodebuild.log").read_text(encoding="utf-8", errors="replace").splitlines()
          matches = [ln for ln in lines if re.search(r"(?:error:|fatal error:|BUILD FAILED|Test Case .* failed)", ln)]
          snippet = "\n".join((matches[-10:] + ["--- tail ---"] + lines[-25:])[-36:])
          print("::error title=macos xcodebuild test::" + snippet.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
            exit 1
          fi

      - name: Lint plists, validate shell scripts & run macOS packaging/installer dry-runs
        run: |
          set -euo pipefail
          plutil -lint deploy/launchd/internal.mesh.meshd.plist
          plutil -lint desktop/macos/MeshVPNApp/Resources/Info.plist
          plutil -lint desktop/macos/MeshVPNApp/Resources/MeshVPN.entitlements
          bash -n scripts/install-macos.sh scripts/package-macos-app.sh
          sh scripts/package-macos-app.sh --dry-run
          sh scripts/install-macos.sh --dry-run
          sh scripts/install-macos.sh --uninstall --dry-run

      - name: Install Rust 1.94.1 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache cargo-deny 0.20.2
        id: cache-deny
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-macos-${{ runner.arch }}

      - name: Install cargo-deny 0.20.2 if not cached
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-deny --version 0.20.2

      - name: Run scripts/check.sh
        run: |
          set -o pipefail
          if ! sh scripts/check.sh 2>&1 | tee /tmp/check-sh.log; then
            echo "::warning title=scripts/check.sh::First attempt failed; retrying once..."
            if ! sh scripts/check.sh 2>&1 | tee /tmp/check-sh.log; then
              python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path("/tmp/check-sh.log").read_text(encoding="utf-8", errors="replace").splitlines()
          matches = [ln for ln in lines if re.search(r"(?:FAILED|error(?:\[|:)|panicked at|ERROR:)", ln)]
          snippet = "\n".join((matches[-15:] + ["--- tail ---"] + lines[-25:])[-40:])
          print("::error title=scripts/check.sh::" + snippet.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
              exit 1
            fi
          fi

      - name: Validate macOS verification script syntax and dry-run checks
        run: |
          bash -n lab/macos/verify-macos-host.sh
          bash lab/macos/verify-macos-host.sh --ci-dry-run

      - name: Run SLO verification suite (US-058)
        run: bash scripts/run-slo-suite.sh --skip-static-checks --output-dir target/slo-macos

      - name: Upload macOS SLO verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-report-macos
          path: target/slo-macos/*
          if-no-files-found: ignore

      - name: Build, codesign & package Darwin release binaries (aarch64 + x86_64)
        run: |
          set -euo pipefail
          MAX_BYTES=$((16 * 1024 * 1024))
          GOAL_BYTES=$((6 * 1024 * 1024))
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" --bin mesh --bin meshd --bin mesh-server
            dist_dir="dist/${target}"
            mkdir -p "${dist_dir}/deploy/launchd" "${dist_dir}/scripts"
            for b in mesh meshd mesh-server; do
              src="target/${target}/release/${b}"
              codesign --force -s - "$src"
              codesign -v "$src"
              size_bytes="$(wc -c < "$src" | tr -d '[:space:]')"
              size_mib="$(awk "BEGIN { printf \"%.2f\", $size_bytes / 1048576 }")"
              echo "${b} (${target}): ${size_bytes} bytes (${size_mib} MiB)"
              if [ "$size_bytes" -gt "$MAX_BYTES" ]; then
                echo "ERROR: ${src} exceeds hard 16 MiB gate (${size_bytes} > ${MAX_BYTES})" >&2
                exit 1
              fi
              if [ "$size_bytes" -gt "$GOAL_BYTES" ]; then
                echo "::warning file=${src}::Binary ${b} (${size_mib} MiB) exceeds 6.00 MiB design target"
              fi
              cp "$src" "${dist_dir}/"
            done
            cp deploy/launchd/internal.mesh.meshd.plist "${dist_dir}/deploy/launchd/"
            cp scripts/install-macos.sh "${dist_dir}/scripts/"
            (
              cd "${dist_dir}"
              shasum -a 256 mesh meshd mesh-server > SHA256SUMS
            )
          done

      - name: Upload built Darwin arm64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: mesh-binaries-aarch64-apple-darwin
          path: dist/aarch64-apple-darwin/*
          if-no-files-found: error

      - name: Upload built Darwin x86_64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: mesh-binaries-x86_64-apple-darwin
          path: dist/x86_64-apple-darwin/*
          if-no-files-found: error

  check-windows:
    name: Check Windows (scripts/check.ps1)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.94.1 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache cargo-deny 0.20.2
        id: cache-deny
        uses: actions/cache@v4
        with:
          path: ~/sdk/bin/cargo-deny.exe
          key: cargo-deny-0.20.2-windows-${{ runner.arch }}

      - name: Download verified cargo-deny 0.20.2 binary
        if: steps.cache-deny.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz'
          $expectedSha256 = '975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc'
          $sdkBin = Join-Path $env:USERPROFILE 'sdk\bin'
          $tmpDir = Join-Path $env:RUNNER_TEMP 'cargo-deny'
          New-Item -ItemType Directory -Force -Path $sdkBin | Out-Null
          New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null
          $archive = Join-Path $tmpDir 'cargo-deny.tar.gz'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expectedSha256) {
            throw "cargo-deny SHA-256 mismatch: expected $expectedSha256, got $actual"
          }
          tar -xzf $archive -C $tmpDir
          $exe = Get-ChildItem -Path $tmpDir -Filter 'cargo-deny.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'cargo-deny.exe not found inside archive' }
          Copy-Item -Path $exe.FullName -Destination (Join-Path $sdkBin 'cargo-deny.exe') -Force

      - name: Run scripts/check.ps1
        shell: pwsh
        run: |
          $logFile = Join-Path $env:RUNNER_TEMP 'check-ps1.log'
          & powershell -ExecutionPolicy Bypass -File scripts/check.ps1 *>&1 | Tee-Object -FilePath $logFile
          if ($LASTEXITCODE -ne 0) {
            @'
          import os, pathlib, re
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "check-ps1.log"
          lines = p.read_text(encoding="utf-8", errors="replace").splitlines()
          matches = [ln for ln in lines if re.search(r"(?:FAILED|error(?:\[|:)|panicked at|Write-Error)", ln)]
          snippet = "\n".join((matches[-15:] + ["--- tail ---"] + lines[-25:])[-40:])
          print("::error title=scripts/check.ps1::" + snippet.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          '@ | python -
            exit 1
          }

      - name: Run Windows Desktop GUI unit tests (gui_unit_tests)
        shell: pwsh
        run: cargo test --locked -p mesh-gui --all-features --all-targets

      - name: Verify MeshVPN compiles on x86_64-pc-windows-gnu
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check --locked --target x86_64-pc-windows-gnu --bin MeshVPN

      - name: Download & verify Wintun 0.14.1 for MESH_WINTUN_SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.wintun.net/builds/wintun-0.14.1.zip'
          $expectedZipSha256 = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $tmpDir = Join-Path $env:RUNNER_TEMP 'wintun-ci-win'
          New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null
          $zipPath = Join-Path $tmpDir 'wintun-0.14.1.zip'
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          $actualZip = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualZip -ne $expectedZipSha256) {
            throw "Wintun archive SHA-256 mismatch: expected $expectedZipSha256, got $actualZip"
          }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $tmpDir -Force
          $dllPath = Join-Path $tmpDir 'wintun\bin\amd64\wintun.dll'
          $dllSha256 = (Get-FileHash -LiteralPath $dllPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($dllSha256 -notmatch '^[0-9a-f]{64}$') {
            throw "Invalid computed wintun.dll SHA-256: $dllSha256"
          }
          "MESH_WINTUN_SHA256=$dllSha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release MeshVPN.exe and verify size <= 6 MiB & PE subsystem == 2
        shell: pwsh
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc --bin MeshVPN
          if ($LASTEXITCODE -ne 0) { throw "cargo build MeshVPN failed" }
          @'
          import pathlib
          import struct
          import sys

          exe = pathlib.Path("target/x86_64-pc-windows-msvc/release/MeshVPN.exe")
          if not exe.is_file():
              raise SystemExit(f"ERROR: missing {exe}")
          raw = exe.read_bytes()
          size_bytes = len(raw)
          max_bytes = 6_291_456
          goal_bytes = 4 * 1024 * 1024
          print(f"MeshVPN.exe size: {size_bytes} bytes ({size_bytes / 1048576:.2f} MiB)")
          if size_bytes > max_bytes:
              raise SystemExit(f"ERROR: MeshVPN.exe exceeds 6 MiB hard limit ({size_bytes} > {max_bytes})")
          if size_bytes > goal_bytes:
              print(f"::warning file={exe}::MeshVPN.exe ({size_bytes / 1048576:.2f} MiB) exceeds 4.00 MiB design target")

          e_lfanew = struct.unpack_from("<I", raw, 0x3C)[0]
          if raw[e_lfanew:e_lfanew + 4] != b"PE\x00\x00":
              raise SystemExit("ERROR: invalid PE signature in MeshVPN.exe")
          opt_offset = e_lfanew + 24
          subsystem = struct.unpack_from("<H", raw, opt_offset + 68)[0]
          print(f"MeshVPN.exe PE subsystem: {subsystem}")
          if subsystem != 2:
              raise SystemExit(f"ERROR: expected PE subsystem 2 (IMAGE_SUBSYSTEM_WINDOWS_GUI), got {subsystem}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "MeshVPN.exe size/PE verification failed" }

      - name: Dry-run verify scripts/install-windows.ps1 (install, -Uninstall, -Uninstall -PurgeData)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/install-windows.ps1 -DryRun
          powershell -ExecutionPolicy Bypass -File scripts/install-windows.ps1 -Uninstall -DryRun
          powershell -ExecutionPolicy Bypass -File scripts/install-windows.ps1 -Uninstall -PurgeData -DryRun

      - name: Run SLO verification suite (US-058)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/run-slo-suite.ps1 -SkipStaticChecks -OutputDir "$env:RUNNER_TEMP\slo-report"

      - name: Verify SLO CI gate fails closed on -SimulateFail
        shell: pwsh
        run: |
          $failDir = Join-Path $env:RUNNER_TEMP 'slo-fail-check'
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          & powershell -ExecutionPolicy Bypass -File scripts/run-slo-suite.ps1 -SkipStaticChecks -SimulateFail -OutputDir $failDir
          $rc = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($rc -eq 0) {
            throw "run-slo-suite.ps1 -SimulateFail unexpectedly exited 0"
          }
          $global:LASTEXITCODE = 0
          Write-Output "Verified fail-closed SLO gate exit code: $rc"

      - name: Upload Windows SLO verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-report-windows
          path: ${{ runner.temp }}/slo-report/*
          if-no-files-found: ignore

  release-build-matrix:
    name: Build Linux & Windows Release Matrix (${{ matrix.target }})
    needs: [static-and-lab-lint, check-linux, check-macos, check-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bins: "mesh meshd mesh-server"
            ext: ""
            codesign: "false"
            check_gnu: "false"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bins: "MeshVPN mesh meshd mesh-server"
            ext: ".exe"
            codesign: "false"
            check_gnu: "true"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.94.1 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: ${{ matrix.target }}

      - name: Add x86_64-pc-windows-gnu target for compile verification
        if: matrix.check_gnu == 'true'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install musl-tools for Linux static musl build
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Download & verify Wintun 0.14.1 and export MESH_WINTUN_SHA256 (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.wintun.net/builds/wintun-0.14.1.zip'
          $expectedZipSha256 = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $tmpDir = Join-Path $env:RUNNER_TEMP 'wintun-download'
          $stageDir = Join-Path $env:RUNNER_TEMP 'wintun-stage'
          New-Item -ItemType Directory -Force -Path $tmpDir, $stageDir | Out-Null
          $zipPath = Join-Path $tmpDir 'wintun-0.14.1.zip'
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          $actualZip = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualZip -ne $expectedZipSha256) {
            throw "Wintun archive SHA-256 mismatch: expected $expectedZipSha256, got $actualZip"
          }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $tmpDir -Force
          $dllPath = Join-Path $tmpDir 'wintun\bin\amd64\wintun.dll'
          if (-not (Test-Path -LiteralPath $dllPath)) {
            throw "wintun/bin/amd64/wintun.dll not found inside archive"
          }
          $dllSha256 = (Get-FileHash -LiteralPath $dllPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($dllSha256 -notmatch '^[0-9a-f]{64}$') {
            throw "Invalid computed wintun.dll SHA-256: $dllSha256"
          }
          Copy-Item -LiteralPath $dllPath -Destination (Join-Path $stageDir 'wintun.dll') -Force
          $licenseFile = Get-ChildItem -Path $tmpDir -Filter 'LICENSE.txt' -Recurse -File | Select-Object -First 1
          if (-not $licenseFile) {
            throw "LICENSE.txt not found inside wintun-0.14.1.zip"
          }
          Copy-Item -LiteralPath $licenseFile.FullName -Destination (Join-Path $stageDir 'WINTUN-LICENSE.txt') -Force
          [System.IO.File]::WriteAllText(
            (Join-Path $stageDir 'wintun.dll.sha256'),
            "$dllSha256  wintun.dll`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          "MESH_WINTUN_SHA256=$dllSha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MESH_WINTUN_STAGE_DIR=$stageDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Verified Wintun 0.14.1 SHA-256 and exported MESH_WINTUN_SHA256=$dllSha256"

      - name: Build release binaries (${{ matrix.target }})
        run: |
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            cargo build --release --locked --target ${{ matrix.target }} --bin MeshVPN --bin mesh --bin meshd --bin mesh-server
          else
            cargo build --release --locked --target ${{ matrix.target }} --bin mesh --bin meshd --bin mesh-server
          fi

      - name: Verify x86_64-pc-windows-gnu target compilation
        if: matrix.check_gnu == 'true'
        run: cargo check --locked --target x86_64-pc-windows-gnu --bin MeshVPN --bin mesh --bin meshd --bin mesh-server

      - name: Ad-hoc codesign macOS binaries
        if: matrix.codesign == 'true'
        run: |
          set -euo pipefail
          for b in ${{ matrix.bins }}; do
            bin_path="target/${{ matrix.target }}/release/$b"
            codesign --force -s - "$bin_path"
            codesign -v "$bin_path"
          done

      - name: Enforce binary size ceiling and report against goals
        shell: bash
        run: |
          set -euo pipefail
          MAX_BYTES=$((16 * 1024 * 1024))
          GOAL_BYTES=$((6 * 1024 * 1024))
          GUI_MAX_BYTES=$((6 * 1024 * 1024))
          GUI_GOAL_BYTES=$((4 * 1024 * 1024))
          mkdir -p dist/${{ matrix.target }}
          for b in ${{ matrix.bins }}; do
            src="target/${{ matrix.target }}/release/${b}${{ matrix.ext }}"
            test -f "$src"
            size_bytes="$(wc -c < "$src" | tr -d '[:space:]')"
            size_mib="$(awk "BEGIN { printf \"%.2f\", $size_bytes / 1048576 }")"
            echo "${b} (${{ matrix.target }}): ${size_bytes} bytes (${size_mib} MiB)"
            if [ "$b" = "MeshVPN" ]; then
              if [ "$size_bytes" -gt "$GUI_MAX_BYTES" ]; then
                echo "ERROR: ${src} exceeds hard 6 MiB gate (${size_bytes} > ${GUI_MAX_BYTES})" >&2
                exit 1
              fi
              if [ "$size_bytes" -gt "$GUI_GOAL_BYTES" ]; then
                echo "::warning file=${src}::Binary ${b} (${size_mib} MiB) exceeds 4.00 MiB design target"
              fi
            else
              if [ "$size_bytes" -gt "$MAX_BYTES" ]; then
                echo "ERROR: ${src} exceeds hard 16 MiB gate (${size_bytes} > ${MAX_BYTES})" >&2
                exit 1
              fi
              if [ "$size_bytes" -gt "$GOAL_BYTES" ]; then
                echo "::warning file=${src}::Binary ${b} (${size_mib} MiB) exceeds 6.00 MiB design target"
              fi
            fi
            cp "$src" "dist/${{ matrix.target }}/"
          done

      - name: Package Windows Wintun runtime, installer assets & SHA256SUMS
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distDir = Join-Path 'dist' '${{ matrix.target }}'
          $scriptsDir = Join-Path $distDir 'scripts'
          New-Item -ItemType Directory -Force -Path $scriptsDir | Out-Null
          foreach ($asset in @('wintun.dll', 'WINTUN-LICENSE.txt', 'wintun.dll.sha256')) {
            Copy-Item -LiteralPath (Join-Path $env:MESH_WINTUN_STAGE_DIR $asset) -Destination (Join-Path $distDir $asset) -Force
          }
          Copy-Item -LiteralPath 'scripts/install-windows.ps1' -Destination (Join-Path $scriptsDir 'install-windows.ps1') -Force
          @'
          import hashlib
          import pathlib
          import struct

          dist = pathlib.Path("dist/x86_64-pc-windows-msvc")
          exe = dist / "MeshVPN.exe"
          raw = exe.read_bytes()
          e_lfanew = struct.unpack_from("<I", raw, 0x3C)[0]
          subsystem = struct.unpack_from("<H", raw, e_lfanew + 24 + 68)[0]
          if subsystem != 2:
              raise SystemExit(f"ERROR: MeshVPN.exe PE subsystem={subsystem}, expected 2")

          explicit_files = ["MeshVPN.exe", "mesh.exe", "meshd.exe", "mesh-server.exe", "wintun.dll"]
          lines = []
          for name in explicit_files:
              p = dist / name
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}")
          (dist / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Windows SHA256SUMS generation failed" }

      - name: Package Linux service units, installers & SHA256SUMS
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          dist_dir="dist/${{ matrix.target }}"
          mkdir -p "${dist_dir}/deploy/systemd" "${dist_dir}/deploy/linux-desktop" "${dist_dir}/scripts"
          cp deploy/systemd/* "${dist_dir}/deploy/systemd/"
          cp deploy/linux-desktop/* "${dist_dir}/deploy/linux-desktop/"
          cp scripts/install-linux.sh scripts/install-server.sh "${dist_dir}/scripts/"
          (
            cd "${dist_dir}"
            sha256sum ${{ matrix.bins }} > SHA256SUMS
          )

      - name: Package macOS launchd plist, installer & SHA256SUMS
        if: matrix.codesign == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dist_dir="dist/${{ matrix.target }}"
          mkdir -p "${dist_dir}/deploy/launchd" "${dist_dir}/scripts"
          cp deploy/launchd/internal.mesh.meshd.plist "${dist_dir}/deploy/launchd/"
          cp scripts/install-macos.sh "${dist_dir}/scripts/"
          (
            cd "${dist_dir}"
            shasum -a 256 ${{ matrix.bins }} > SHA256SUMS
          )

      - name: Upload built target binaries
        uses: actions/upload-artifact@v4
        with:
          name: mesh-binaries-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error

  docker-build-and-lab:
    name: Docker Multi-Stage Build & Optional NAT Lab
    needs: [static-and-lab-lint, check-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NAT Lab & mesh-server Docker images
        run: |
          docker compose -f lab/docker-compose.nat-lab.yml --profile reverse-proxy build

      - name: Verify mesh-server runs as non-root user with mesh-admin group
        run: |
          uid="$(docker run --rm --entrypoint id mesh-vpn/mesh-server:lab -u)"
          groups="$(docker run --rm --entrypoint id mesh-vpn/mesh-server:lab -Gn)"
          echo "mesh-server container UID=$uid GROUPS=$groups"
          test "$uid" != "0"
          printf ' %s ' "$groups" | grep -q ' mesh-admin '

      - name: Run Full NAT Chaos & Roaming Acceptance Suite (opt-in / manual)
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.run_live_nat_lab == true) ||
          vars.ENABLE_LIVE_NAT_LAB == 'true'
        env:
          US028_FLAP_DURATION_SECS: ${{ inputs.flap_duration_secs || '90' }}
        run: |
          mkdir -p lab/.tmp
          bash lab/scenarios/run-all-chaos.sh \
            --report-json "lab/.tmp/chaos-acceptance-report.json" \
            --flap-duration "$US028_FLAP_DURATION_SECS"

      - name: Upload US-028 Acceptance Reports
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.run_live_nat_lab == true) || vars.ENABLE_LIVE_NAT_LAB == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: us028-acceptance-report
          path: lab/.tmp/
          if-no-files-found: ignore
