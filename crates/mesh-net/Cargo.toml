[package]
name = "mesh-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["desktop-os"]
desktop-ipc = ["dep:axum", "dep:hyper", "dep:hyper-util"]
desktop-os = ["desktop-ipc", "dep:windows-service", "mesh-crypto/desktop-certs"]

[dependencies]
mesh-core.workspace = true
mesh-crypto = { path = "../mesh-crypto", version = "0.3.0", default-features = false }
mesh-proto.workspace = true
mesh-sys.workspace = true
axum = { workspace = true, optional = true }
base64.workspace = true
bytes.workspace = true
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
